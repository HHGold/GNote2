name: Android Release Build

on:
  push:
    tags:
      - 'v*' # 當您上傳像 v1.0.8 這樣的標籤時，觸發自動打包

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printenv KEYSTORE_B64 | base64 --decode > app/release.p12

      - name: Decode Google Services JSON
        env:
          GSERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printenv GSERVICES_B64 | base64 --decode > app/google-services.json

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION_NAME=${TAG_NAME#v}
          # 格式化 Version Code (例如 1.0.8 -> 10008)
          VERSION_CODE_RAW=$(echo $VERSION_NAME | sed 's/\./ /g')
          read MAJOR MINOR PATCH <<< "$VERSION_CODE_RAW"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + (PATCH:-0)))
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Build APK
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}

      - name: Rename APK and create SHA-256
        run: |
          mv app/build/outputs/apk/release/app-release.apk GNote2.apk
          sha256sum GNote2.apk > GNote2.apk.sha256

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            GNote2.apk
            GNote2.apk.sha256
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
